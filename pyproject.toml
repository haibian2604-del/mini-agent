[project]
name = "mini-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.106.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
mini-agent = "mini_agent.run:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
